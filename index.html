<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Utama</title>
<style>
  /* Mengatur agar konten berada tepat di tengah layar */
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background-color: #f5f5f5;
    color: #222;
    margin: 0;
    padding: 20px;
    
    /* Flexbox untuk menengahkan secara vertikal dan horizontal */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }

  /* Wadah untuk link-link agar berurutan ke bawah */
  .menu-container {
    display: flex;
    flex-direction: column;
    gap: 20px; /* Jarak antar link */
    width: 100%;
    max-width: 400px; /* Lebar maksimal menu di layar besar */
  }

  /* Desain Link/Tombol */
  .menu-link {
    text-decoration: none;
    color: #ffffff;
    background-color: #2563eb;
    padding: 20px 24px;
    border-radius: 12px;
    font-size: 1.5rem; /* Memperbesar tulisan */
    font-weight: 600;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background-color 0.2s, transform 0.1s;
  }

  /* Efek saat disentuh/diklik */
  .menu-link:active {
    background-color: #1d4ed8;
    transform: scale(0.98);
  }
</style>
</head>
<body>

  <div class="menu-container">
    <!-- Link Pertama -->
    <a href="kartu-jeda.html" class="menu-link">Kartu Afirmasi</a>
    
    <!-- Nanti link baru tinggal ditambahkan di bawah sini, contoh: -->
    <!-- <a href="halaman-lain.html" class="menu-link">Halaman Lain</a> -->
  </div>

</body>
</html>
