        button {

        .btn-outline { background-color: white; color: var(--primary); border: 2px solid var(--primary); }

        #status { width: 100%; text-align: center; font-size: 14px; color: #d9534f; margin-top: 5px; font-weight: bold; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 30px; padding: 30px; max-width: 1400px; margin: 0 auto; }
        .card-item { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; transition: transform 0.3s; }
        .card-item:hover { transform: translateY(-8px); }
        .canvas-wrapper { width: 100%; aspect-ratio: 9 / 19.5; background: #eee; }
        .canvas-wrapper canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-actions { padding: 15px; text-align: center; border-top: 1px solid #f0f0f0; }
        .card-actions button { width: 100%; justify-content: center; padding: 8px; font-size: 13px; box-shadow: none; }
        
        @media print {
            body { background: white; }
            .top-bar, .card-actions { display: none !important; }
            .grid-container { display: block; padding: 0; margin: 0; }
            .card-item { page-break-after: always; box-shadow: none; border-radius: 0; width: 100%; height: 100vh; margin: 0; padding: 0; }
            .canvas-wrapper { width: 100vw; height: 100vh; aspect-ratio: auto; }
            .canvas-wrapper canvas { width: 100%; height: 100%; object-fit: contain; }
        }

        // Load Gambar Unsplash/Pexels
        function loadImage(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = url;
            });
        }

        // Helper: Word Wrap Auto Scale
        function wrapTextWithAutoScale(ctx, text, x, y, maxWidth, initialFontSize, fontFamily, fontWeight, color, lineHeightMultiplier = 1.3) {
            let fontSize = initialFontSize;
            let lines = [];
            while (fontSize > 20) {
                ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
                lines = [];
                let currentLine = '';
                const words = text.split(' ');
                for (let n = 0; n < words.length; n++) {
                    let testLine = currentLine + words[n] + ' ';
                    if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                        lines.push(currentLine.trim());
                        currentLine = words[n] + ' ';
                    } else {
                        currentLine = testLine;
                    }
                }
                lines.push(currentLine.trim());
                let hasOverflow = false;
                for (let line of lines) {
                    if (ctx.measureText(line).width > maxWidth) { hasOverflow = true; break; }
                }
                if (!hasOverflow) break; 
                fontSize -= 2; 
            }
            ctx.fillStyle = color;
            let currentY = y;
            const lineHeight = fontSize * lineHeightMultiplier;
            lines.forEach(line => {
                ctx.fillText(line, x, currentY);
                currentY += lineHeight;
            });
            return lines.length * lineHeight; 
        }

        // --- 2. FUNGSI RENDER KARTU ---
        async function drawCard(ctx, text1, text2, bgImg) {
            // Background
            if (bgImg) {
                const scale = Math.max(WIDTH / bgImg.width, HEIGHT / bgImg.height);
                const x = (WIDTH / 2) - (bgImg.width / 2) * scale;
                const y = (HEIGHT / 2) - (bgImg.height / 2) * scale;
                ctx.drawImage(bgImg, x, y, bgImg.width * scale, bgImg.height * scale);
            } else {
                ctx.fillStyle = "#87CEEB";
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }

            // Overlay Gradien
            const overlayGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
            overlayGrad.addColorStop(0, "rgba(0,0,0,0.0)"); 
            overlayGrad.addColorStop(0.3, "rgba(0,0,0,0.15)"); 
            overlayGrad.addColorStop(0.5, "rgba(0,0,0,0.25)"); 
            overlayGrad.addColorStop(0.7, "rgba(0,0,0,0.25)"); 
            overlayGrad.addColorStop(1, "rgba(0,0,0,0.5)");   
            ctx.fillStyle = overlayGrad;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Teks Setup
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // --- UBAH SEMUA WARNA JADI PUTIH SOLID ---
            ctx.fillStyle = "#FFFFFF";
            
            // Bayangan Teks Dasar
            ctx.shadowColor = "rgba(0,0,0,0.85)";
            ctx.shadowBlur = 15;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 5;

            // --- ORNAMEN TERATAI ---
            const cx = WIDTH / 2;
            const cy = 450; 
            const scale = 0.8; 
            ctx.beginPath();
            ctx.moveTo(cx, cy - 30 * scale);
            ctx.bezierCurveTo(cx - 15 * scale, cy - 10 * scale, cx - 10 * scale, cy + 20 * scale, cx, cy + 30 * scale);
            ctx.bezierCurveTo(cx + 10 * scale, cy + 20 * scale, cx + 15 * scale, cy - 10 * scale, cx, cy - 30 * scale);
            ctx.moveTo(cx - 10 * scale, cy + 25 * scale);
            ctx.bezierCurveTo(cx - 40 * scale, cy, cx - 50 * scale, cy - 20 * scale, cx - 40 * scale, cy - 40 * scale);
            ctx.bezierCurveTo(cx - 30 * scale, cy - 20 * scale, cx - 15 * scale, cy, cx - 10 * scale, cy + 25 * scale);
            ctx.moveTo(cx + 10 * scale, cy + 25 * scale);
            ctx.bezierCurveTo(cx + 40 * scale, cy, cx + 50 * scale, cy - 20 * scale, cx + 40 * scale, cy - 40 * scale);
            ctx.bezierCurveTo(cx + 30 * scale, cy - 20 * scale, cx + 15 * scale, cy, cx + 10 * scale, cy + 25 * scale);
            ctx.moveTo(cx - 25 * scale, cy + 20 * scale);
            ctx.bezierCurveTo(cx - 60 * scale, cy + 10 * scale, cx - 70 * scale, cy - 15 * scale, cx - 60 * scale, cy - 35 * scale);
            ctx.bezierCurveTo(cx - 45 * scale, cy - 15 * scale, cx - 30 * scale, cy, cx - 25 * scale, cy + 20 * scale);
            ctx.moveTo(cx + 25 * scale, cy + 20 * scale);
            ctx.bezierCurveTo(cx + 60 * scale, cy + 10 * scale, cx + 70 * scale, cy - 15 * scale, cx + 60 * scale, cy - 35 * scale);
            ctx.bezierCurveTo(cx + 45 * scale, cy - 15 * scale, cx + 30 * scale, cy, cx + 25 * scale, cy + 20 * scale);
            ctx.moveTo(cx - 40 * scale, cy + 25 * scale);
            ctx.quadraticCurveTo(cx, cy + 50 * scale, cx + 40 * scale, cy + 25 * scale);
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 3;
            ctx.stroke();

            // --- KALKULASI POSISI TEKS DI TENGAH ---
            const maxTextWidth = WIDTH - 360; 
            
            const fontSize1 = 38; // Playfair Display
            const fontSize2 = 55; // Alex Brush
            const spacing = 40;   // Jarak antara teks 1 dan 2

            // 1. Hitung tinggi blok teks 1
            ctx.font = `600 ${fontSize1}px 'Playfair Display', serif`;
            let tempLines = [];
            let tempLine = "";
            let tempWords = text1.split(' ');
            for (let n = 0; n < tempWords.length; n++) {
                let testLine = tempLine + tempWords[n] + ' ';
                if (ctx.measureText(testLine).width > maxTextWidth && n > 0) { tempLines.push(tempLine.trim()); tempLine = tempWords[n] + ' '; } 
                else { tempLine = testLine; }
            }
            tempLines.push(tempLine.trim());
            let h1 = tempLines.length * (fontSize1 * 1.5); 

            // 2. Hitung tinggi blok teks 2
            ctx.font = `400 ${fontSize2}px 'Alex Brush', cursive`;
            tempLines = [];
            tempLine = "";
            tempWords = text2.split(' ');
            for (let n = 0; n < tempWords.length; n++) {
                let testLine = tempLine + tempWords[n] + ' ';
                if (ctx.measureText(testLine).width > maxTextWidth && n > 0) { tempLines.push(tempLine.trim()); tempLine = tempWords[n] + ' '; } 
                else { tempLine = testLine; }
            }
            tempLines.push(tempLine.trim());
            let h2 = tempLines.length * (fontSize2 * 1.2);

            // 3. Hitung titik mulai (Center Y dipindah ke 750)
            const totalTextHeight = h1 + spacing + h2;
            const centerY = 750; 
            
            let startY = centerY - (totalTextHeight / 2) + (h1 / 2);

            // 4. Render Teks 1
            wrapTextWithAutoScale(ctx, text1, WIDTH/2, startY, maxTextWidth, fontSize1, "'Playfair Display', serif", "600", "#FFFFFF", 1.5);
            
            // 5. Render Teks 2 (Khusus Font 2: Warna Putih + Shadow Lebih Tebal)
            // Shadow dipertebal agar Alex Brush yang tipis tetap menonjol
            ctx.shadowBlur = 20; 
            ctx.shadowOffsetY = 6;
            
            let y2 = startY + (h1 / 2) + spacing + (h2 / 2);
            wrapTextWithAutoScale(ctx, text2, WIDTH/2, y2, maxTextWidth, fontSize2, "'Alex Brush', cursive", "400", "#FFFFFF", 1.2);

            // Kembalikan shadow ke pengaturan awal untuk divider
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 5;

            // --- DIVIDER & HATI ---
            const dividerY = y2 + (h2 / 2) + 80; 
            ctx.beginPath();
            ctx.moveTo(WIDTH/2 - 100, dividerY);
            ctx.lineTo(WIDTH/2 + 100, dividerY);
            ctx.strokeStyle = "rgba(255,255,255,0.6)";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = "#86A38D"; 
            ctx.font = "40px Arial";
            ctx.fillText("♥", WIDTH/2, dividerY + 60);

            // --- QR CODE ---
            if (qrLoaded) {
                const qrSize = 110; 
                const qrX = (WIDTH - qrSize) / 2; 
                const qrY = HEIGHT - 350; 
                
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
                
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                ctx.beginPath();
                ctx.roundRect(qrX - 10, qrY - 10, qrSize + 20, qrSize + 20, 10);
                ctx.fill();

                ctx.globalAlpha = 0.8;
                ctx.drawImage(imgQR, qrX, qrY, qrSize, qrSize);
                
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = "#FFFFFF";
                ctx.font = `italic 400 24px 'Playfair Display', serif`; 
                
                ctx.shadowBlur = 5;
                ctx.shadowOffsetY = 2;
                
                ctx.fillText("Pindai untuk ruang tenang", WIDTH/2, qrY + qrSize + 40);
                
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }
        }

        // --- 3. FUNGSI GENERATE ---
        async function generateCards() {
            const btnGen = document.getElementById('btnGenerate');
            const btnZip = document.getElementById('btnDownloadZip');
            const btnPrint = document.getElementById('btnPrint');
            const status = document.getElementById('status');
            const container = document.getElementById('previewContainer');
            
            btnGen.disabled = true;
            btnZip.disabled = true;
            btnPrint.disabled = true;
            container.innerHTML = '';
            generatedCanvases = [];
            status.innerText = "Mengunduh gambar background... Mohon tunggu.";

            await document.fonts.ready;

            for (let i = 0; i < afirmasiList.length; i++) {
                const item = afirmasiList[i];
                status.innerText = `Memproses kartu ${i + 1} / 52...`;

                const bgImg = await loadImage(item.img);
                const canvas = document.createElement('canvas');
                canvas.width = WIDTH;
                canvas.height = HEIGHT;
                const ctx = canvas.getContext('2d');

                await drawCard(ctx, item.part1, item.part2, bgImg);

                const fileName = `Kartu-Jeda-${i+1}.png`;
                generatedCanvases.push({ canvas: canvas, name: fileName });

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-item';
                const canvasWrapper = document.createElement('div');
                canvasWrapper.className = 'canvas-wrapper';
                const previewCanvas = document.createElement('canvas');
                previewCanvas.width = WIDTH;
                previewCanvas.height = HEIGHT;
                previewCanvas.getContext('2d').drawImage(canvas, 0, 0);
                canvasWrapper.appendChild(previewCanvas);
                
                const actionDiv = document.createElement('div');
                actionDiv.className = 'card-actions';
                const btnSingle = document.createElement('button');
                btnSingle.innerText = `⬇️ Unduh (${i+1})`;
                btnSingle.onclick = () => downloadSingle(canvas, fileName);
                
                actionDiv.appendChild(btnSingle);
                cardDiv.appendChild(canvasWrapper);
                cardDiv.appendChild(actionDiv);
                container.appendChild(cardDiv);
            }

            status.innerText = "Selesai! Klik 'Unduh Semua (ZIP)' untuk menyimpan ke-52 kartu.";
            btnGen.innerText = "🔄 Generate Ulang";
            btnGen.disabled = false;
            btnZip.disabled = false;
            btnPrint.disabled = false;
        }

        // --- 4. FUNGSI DOWNLOAD ---
        function downloadSingle(canvas, filename) {
            canvas.toBlob(function(blob) {
                saveAs(blob, filename);
            }, "image/png");
        }

        async function downloadZip() {
            const btnZip = document.getElementById('btnDownloadZip');
            const status = document.getElementById('status');
            
            btnZip.disabled = true;
            status.innerText = "Membuat file ZIP... (Proses memakan waktu 10-30 detik, mohon tunggu)";

            const zip = new JSZip();
            const folder = zip.folder("Kartu-Jeda-Sejati");

            for (let i = 0; i < generatedCanvases.length; i++) {
                const item = generatedCanvases[i];
                
                const blob = await new Promise(resolve => item.canvas.toBlob(resolve, "image/png"));
                folder.file(item.name, blob);
                
                status.innerText = `Memasukkan file ke ZIP: ${i + 1} / 52...`;
                await new Promise(r => setTimeout(r, 10)); 
            }

            status.innerText = "Menyelesaikan ZIP...";
            zip.generateAsync({ type: "blob" }).then(function(content) {
                saveAs(content, "Kartu-Jeda-Lengkap.zip");
                status.innerText = "Berhasil! File ZIP telah diunduh ke folder Download.";
                btnZip.disabled = false;
            });
        }
    </script>
